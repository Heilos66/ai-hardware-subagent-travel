spring.application.name=travel-agent
server.address=0.0.0.0
server.port=${PORT:8080}
spring.main.banner-mode=off
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# URLs and upstream diagnostics may contain credentials. Do not enable wire logging.
logging.level.org.springframework.web=WARN
logging.level.reactor.netty=WARN
logging.level.org.springframework.ai=WARN
logging.level.org.springframework.ai.chat.model.MessageAggregator=OFF
server.error.include-message=never
server.error.include-stacktrace=never
